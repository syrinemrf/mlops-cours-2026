stages:
  download:
    cmd: python -m src.download
    deps:
    - src/dataset_config.py
    - src/download.py
    params:
    - dataset.yaml:
      - features
      - raw_path
      - sensitive
      - source
      - target
    outs:
    - data/raw/dataset.csv
  prepare:
    cmd: python -m src.prepare
    deps:
    - data/raw/dataset.csv
    - src/dataset_config.py
    - src/prepare.py
    params:
    - prepare
    - dataset.yaml:
      - features
      - sensitive
      - split
      - target
    outs:
    - data/processed/features.parquet
    - data/processed/test.csv
    - data/processed/train.csv
  train:
    cmd: python -m src.train
    deps:
    - src/dataset_config.py
    - src/train.py
    - uv.lock
    - data/raw/dataset.csv
    - data/processed/train.csv
    - data/processed/test.csv
    params:
    - dataset.yaml:
      - name
      - features
      - target
      - raw_path
      - source
      - metrics
    - train
    outs:
    - models/model
  evaluate:
    cmd: python -m src.evaluate
    deps:
    - src/dataset_config.py
    - src/evaluate.py
    - src/train.py
    - uv.lock
    - models/model
    - data/processed/test.csv
    params:
    - dataset.yaml:
      - features
      - target
      - metrics
    metrics:
    - reports/metrics.json:
        cache: false
