# Coûts 1:1 : hypothèse expérimentale neutre, pas des coûts RH établis.
# Gate ROC AUC 0.70 conservée du cours, proposition à valider avant entraînement.
# Sensibles conservés pour audit, exclus des prédicteurs ; ordinaux encodés one-hot.
name: ibm-hr-attrition
description: Données synthétiques IBM de départ des employés ; usage pédagogique, sans causalité ni historique réel.
source:
  url: https://www.kaggle.com/datasets/pavansubhasht/ibm-hr-analytics-attrition-dataset
  license: ODbL-1.0 (database) + DbCL-1.0 (contents)
  citation: IBM data scientists (fictional dataset), distributed by pavansubhasht on Kaggle, version 1 (2017-03-31).
  kaggle_ref: pavansubhasht/ibm-hr-analytics-attrition-dataset
  version: 1
  filename: WA_Fn-UseC_-HR-Employee-Attrition.csv
  sha256: a5c31e38bd7fafc9bc333884eb181b06b41b8e5e488e8f7ccb27199fb3be7659
raw_path: data/raw/dataset.csv
target:
  column: Attrition
  positive_class: 'Yes'
features:
  numeric:
  - DailyRate
  - DistanceFromHome
  - HourlyRate
  - MonthlyIncome
  - MonthlyRate
  - NumCompaniesWorked
  - PercentSalaryHike
  - TotalWorkingYears
  - TrainingTimesLastYear
  - YearsAtCompany
  - YearsInCurrentRole
  - YearsSinceLastPromotion
  - YearsWithCurrManager
  categorical:
  - BusinessTravel
  - Department
  - EducationField
  - JobRole
  - OverTime
  - Education
  - EnvironmentSatisfaction
  - JobInvolvement
  - JobLevel
  - JobSatisfaction
  - PerformanceRating
  - RelationshipSatisfaction
  - StockOptionLevel
  - WorkLifeBalance
sensitive:
- column: Age
  bins:
  - 0
  - 30
  - 40
  - 50
  - 120
  labels:
  - <30
  - 30-39
  - 40-49
  - '>=50'
- column: Gender
- column: MaritalStatus
metrics:
  primary: roc_auc
  promotion_threshold: 0.7
  cost_matrix:
    false_negative: 1
    false_positive: 1
split:
  test_size: 0.2
  random_state: 42
