# Protocol A DVC candidate; grid families explicitly preserve their historical weights.
prepare:
  id_column: EmployeeNumber
  # Technical reproducibility timestamp for Feast, not a real HR observation date.
  event_timestamp: "2026-01-01T00:00:00+00:00"

train:
  model: logistic_regression
  C: 1.0
  class_weight: none
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.1
  random_state: 42

# Lab 3 : contrat de données Great Expectations (src/validate_data.py --build-suite).
# La suite est construite sur data/processed/train.csv UNIQUEMENT (split avant toute
# statistique : aucune information du jeu de test dans les domaines du contrat).
validation:
  mostly: 0.99  # tolérance des contrôles de valeurs : au plus 1 % hors domaine
  # Règles métier IBM HR (A >= B), vérifiées sans exception sur les 1470 lignes brutes
  # le 2026-11-08 : une ancienneté ne peut pas dépasser celle qui la contient.
  column_pairs:
  - [TotalWorkingYears, YearsAtCompany]
  - [YearsAtCompany, YearsInCurrentRole]
  - [YearsAtCompany, YearsWithCurrManager]
  - [YearsAtCompany, YearsSinceLastPromotion]
  - [Age, TotalWorkingYears]
