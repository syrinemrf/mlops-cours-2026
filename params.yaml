# Course names and training defaults preserved; no training runs in this increment.
prepare:
  id_column: EmployeeNumber
  # Technical reproducibility timestamp for Feast, not a real HR observation date.
  event_timestamp: "2026-01-01T00:00:00+00:00"

train:
  model: logistic_regression
  C: 0.1
  class_weight: balanced
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.1
  random_state: 42
