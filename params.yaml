# Protocol A DVC candidate; grid families explicitly preserve their historical weights.
prepare:
  id_column: EmployeeNumber
  # Technical reproducibility timestamp for Feast, not a real HR observation date.
  event_timestamp: "2026-01-01T00:00:00+00:00"

train:
  model: logistic_regression
  C: 1.0
  class_weight: none
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.1
  random_state: 42

# Lab 3 : contrat de données Great Expectations (src/validate_data.py --build-suite).
# La suite est construite sur data/processed/train.csv UNIQUEMENT (split avant toute
# statistique : aucune information du jeu de test dans les domaines du contrat).
validation:
  mostly: 0.99  # tolérance des contrôles de valeurs : au plus 1 % hors domaine
  # Règles métier IBM HR (A >= B), vérifiées sans exception sur les 1470 lignes brutes
  # le 2026-11-08 : une ancienneté ne peut pas dépasser celle qui la contient.
  column_pairs:
  - [TotalWorkingYears, YearsAtCompany]
  - [YearsAtCompany, YearsInCurrentRole]
  - [YearsAtCompany, YearsWithCurrManager]
  - [YearsAtCompany, YearsSinceLastPromotion]
  - [Age, TotalWorkingYears]

# Lab 3 : lots simulés (src/simulate.py ; pipelines test_bad_data et drift_demo).
simulation:
  sample_frac: 0.5  # lot sain : moitié des salariés, tirés sans remise
  # Lot corrompu : trois bugs « silencieux » d'un SIRH fournisseur
  corrupt:
    unit_scale:  # salaire mensuel exporté en annuel
      MonthlyIncome: 12
    unknown_code:  # nouveau code de département non déclaré, sur 10 % des lignes
      column: Department
      value: Unknown
      rate: 0.10
    missing_target_rate: 0.05  # statut de départ non renseigné

# Lab 3 : détection de drift (src/detect_drift.py, pipelines KFP)
drift:
  ks_alpha: 0.05  # significativité : p-value du test (KS numérique, chi2 catégorielle)
  psi_threshold: 0.25  # magnitude : PSI à partir duquel le déplacement compte
  drift_share: 0.1  # gate : le lot dérive dès que 10 % des colonnes dérivent
  # Scénario simulé, propre au dataset : vague d'embauches plus jeunes, plus éloignées,
  # moins payées et plus souvent en heures supplémentaires. Données valides (contrat GX
  # respecté), mais population déplacée.
  simulation:
    scale:  # facteurs multiplicatifs
      DistanceFromHome: 1.5
      MonthlyIncome: 0.8
    shift:  # décalages, bornés au domaine observé
      Age: -6
    reassign:  # part des lignes qui reçoivent la modalité
      OverTime:
        value: "Yes"
        rate: 0.4
